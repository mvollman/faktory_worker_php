version: '3'

services:
  faktory_php:
    container_name: faktory-php
    image: php:8.2.35-apache
    volumes:
      - ./:/var/www/html/
  faktory:
    container_name: faktory
    image: contribsys/faktory
    ports:
      - 7419:7419
      - 7420:7420
